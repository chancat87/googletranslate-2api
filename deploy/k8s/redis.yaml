apiVersion: apps/v1
kind: Deployment
metadata:
  name: googletranslate-2api-redis
  labels:
    app.kubernetes.io/name: googletranslate-2api-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: googletranslate-2api-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: googletranslate-2api-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: googletranslate-2api-redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: googletranslate-2api-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
