worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # v2.6.0: 响应压缩 (JSON/文本/JS/CSS), SSE 的 text/event-stream 不压缩,
    # 避免流式响应被缓冲; proxy_buffering 已关闭。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml;

    upstream googletranslate_backend {
        # 双副本蓝绿滚动: 任一副本重建/未就绪时, 另一个继续承接流量
        server app-blue:8000;
        server app-green:8000;
        keepalive 32;
    }

    # --- 限流兜底 (3.B.4, 默认不限制任何请求) ---
    limit_req_zone $binary_remote_addr zone=translate_global:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://googletranslate_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流式传输优化
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            # 超时与请求体大小限制
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 2m;

            # 蓝绿升级核心: 上游一个副本短暂不可用时, 自动重试到另一个
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # 网关层限流(默认关闭, 需要时取消注释并调参)
            # limit_req_status 429;
            # limit_req zone=translate_global burst=20 nodelay;
        }
    }
}
