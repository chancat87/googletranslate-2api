<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>googletranslate-2api 管理面板</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --surface-3: #e6ebf1;
      --text: #16202b;
      --muted: #64748b;
      --line: #dbe1ea;
      --accent: #0f62fe;
      --accent-soft: #e6efff;
      --teal: #0e9384;
      --teal-soft: #e2f6f2;
      --amber: #b45309;
      --amber-soft: #fdf1df;
      --danger: #dc2626;
      --danger-soft: #feecec;
      --ok: #0d8a4e;
      --ok-soft: #e4f6ec;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .1);
      --shadow-md: 0 6px 18px rgba(16, 24, 40, .1);
      --radius: 8px;
      --radius-sm: 6px;
      --sidebar-w: 248px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0b0f14;
      --surface: #141b24;
      --surface-2: #1c2632;
      --surface-3: #243140;
      --text: #e6edf5;
      --muted: #8ea0b5;
      --line: #263442;
      --accent: #4c8dff;
      --accent-soft: #15233c;
      --teal: #37c6b2;
      --teal-soft: #12312d;
      --amber: #f0a95d;
      --amber-soft: #33251a;
      --danger: #f87171;
      --danger-soft: #3a1d1d;
      --ok: #4ade80;
      --ok-soft: #143324;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4), 0 1px 3px rgba(0, 0, 0, .5);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, .5);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      min-height: 100dvh;
      transition: background .2s ease, color .2s ease;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--line);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 12px; border-bottom: 1px solid var(--line); }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      color: #fff; font-weight: 800; font-size: 18px; flex: 0 0 auto;
    }
    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0; white-space: nowrap; }
    .brand-sub { color: var(--muted); font-size: 12px; letter-spacing: 0; }
    .nav { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border: 0; border-radius: var(--radius-sm);
      background: transparent; color: var(--muted); text-align: left; font-size: 14px;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .nav-item svg { flex: 0 0 auto; }
    .sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 24px; border-bottom: 1px solid var(--line);
      background: var(--surface); position: sticky; top: 0; z-index: 15;
    }
    .topbar-title h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .topbar-title p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    .token-wrap { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .token-wrap label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .token-wrap input {
      width: 220px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: var(--radius-sm); background: var(--surface-2); outline: none;
    }
    .token-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .content { padding: 24px; max-width: 1480px; width: 100%; }
    .view { display: block; }
    .view[hidden] { display: none !important; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
    .card-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .card-head h2 { margin: 0; font-size: 15px; letter-spacing: 0; }
    .card-head .hint { color: var(--muted); font-size: 12px; }
    .card-body { padding: 16px; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 14px; box-shadow: var(--shadow-sm); min-height: 92px;
    }
    .stat-label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .stat-value { font-size: 24px; font-weight: 700; letter-spacing: 0; margin-top: 6px; }
    .stat-value small { font-size: 13px; color: var(--muted); font-weight: 400; }
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--text); font-weight: 600; font-size: 13px;
    }
    .btn:hover { background: var(--surface-2); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent); filter: brightness(.94); }
    .btn-danger { color: var(--danger); }
    .btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .health-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 4px var(--surface-2); }
    .health-dot.ok { background: var(--ok); }
    .health-dot.bad { background: var(--danger); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; white-space: nowrap; }
    td { word-break: break-all; }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; background: var(--surface-2); border-radius: 4px; padding: 2px 6px; }
    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.err { background: var(--danger-soft); color: var(--danger); }
    .pill.muted { background: var(--surface-3); color: var(--muted); }
    .input, .select, .textarea {
      width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface-2); outline: none;
    }
    .input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .textarea { min-height: 150px; resize: vertical; }
    .translate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .form-row .field { flex: 1; min-width: 150px; }
    .field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .output {
      min-height: 320px; max-height: 56vh; overflow: auto; white-space: pre-wrap;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      padding: 14px; margin: 0; font-family: inherit;
    }
    .empty { color: var(--muted); text-align: center; padding: 40px 10px; }
    .toast {
      position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
      opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; z-index: 60;
      max-width: min(92vw, 520px); box-shadow: var(--shadow-md);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--danger); color: #fff; }
    .toast.ok { background: var(--ok); color: #fff; }
    .health-panel { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
    .mobile-nav { display: none; }
    .nav-mobile-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 4px; border: 0; background: transparent; color: var(--muted); font-size: 11px;
    }
    .nav-mobile-item.active { color: var(--accent); font-weight: 700; }
    .settings-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 1023px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .translate-grid { grid-template-columns: 1fr; }
      .content { padding: 16px; }
      .mobile-nav {
        display: flex; position: fixed; inset: auto 0 0 0; z-index: 30;
        background: var(--surface); border-top: 1px solid var(--line); padding: 4px 6px calc(4px + env(safe-area-inset-bottom));
      }
      body { padding-bottom: 64px; }
    }
    @media (max-width: 640px) {
      .topbar { padding: 10px 12px; flex-wrap: wrap; }
      .token-wrap { display: none; }
      .topbar-title h1 { font-size: 16px; }
      .stat-grid { grid-template-columns: repeat(2, 1fr); }
      .settings-row { grid-template-columns: 1fr; }
      .form-row .field { flex-basis: 100%; }
      .card-body { padding: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <aside class="sidebar" aria-label="导航">
    <div class="brand">
      <div class="brand-mark">G</div>
      <div>
        <div class="brand-name">googletranslate-2api</div>
        <div class="brand-sub">管理面板</div>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <button class="nav-item active" data-view="overview"><span data-icon="overview"></span>总览</button>
      <button class="nav-item" data-view="translate"><span data-icon="translate"></span>翻译</button>
      <button class="nav-item" data-view="keys"><span data-icon="keys"></span>Keys</button>
      <button class="nav-item" data-view="usage"><span data-icon="usage"></span>用量</button>
      <button class="nav-item" data-view="traces"><span data-icon="traces"></span>最近请求</button>
      <button class="nav-item" data-view="settings"><span data-icon="settings"></span>设置</button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn" data-action="selfcheck"><span data-icon="zap"></span>自检</button>
      <button class="btn" data-action="theme">切换主题</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="viewTitle">总览</h1>
        <p id="viewDesc">服务健康与关键指标</p>
      </div>
      <span class="health-dot" id="healthDot" title="健康状态"></span>
      <div class="token-wrap">
        <label for="token">API_MASTER_KEY</label>
        <input id="token" type="password" autocomplete="off" placeholder="填主密钥后保存">
        <button class="btn btn-primary" data-action="savetoken">保存</button>
      </div>
    </header>

    <div class="content">
      <section class="view" data-view="overview" id="view-overview"><div id="overviewContainer"><div class="empty">加载中…</div></div></section>
      <section class="view" data-view="translate" id="view-translate" hidden>
        <div class="translate-grid">
          <div class="card">
            <div class="card-head"><h2>翻译工作台</h2><span class="hint">调用 /v1/chat/completions</span></div>
            <div class="card-body">
              <div class="field">
                <label for="transText">待翻译文本</label>
                <textarea id="transText" class="textarea" placeholder="输入要翻译的内容…"></textarea>
              </div>
              <div class="form-row" style="margin:12px 0">
                <div class="field">
                  <label for="transSource">源语言</label>
                  <select id="transSource" class="select">
                    <option value="auto">自动检测</option>
                    <option value="en">英语</option>
                    <option value="zh-CN">中文</option>
                    <option value="ja">日语</option>
                    <option value="ko">韩语</option>
                    <option value="ru">俄语</option>
                    <option value="ar">阿拉伯语</option>
                  </select>
                </div>
                <div class="field">
                  <label for="transTarget">目标语言</label>
                  <select id="transTarget" class="select">
                    <option value="zh-CN">中文</option>
                    <option value="en">英语</option>
                    <option value="ja">日语</option>
                    <option value="ko">韩语</option>
                    <option value="ru">俄语</option>
                    <option value="ar">阿拉伯语</option>
                  </select>
                </div>
              </div>
              <div class="form-row" style="align-items:center">
                <label style="display:flex;align-items:center;gap:8px;min-width:130px">
                  <input type="checkbox" id="transStream" checked> 流式输出
                </label>
                <button class="btn btn-primary" data-action="translate"><span data-icon="send"></span>翻译</button>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-head"><h2>译文输出</h2><span class="hint" id="translateMeta">等待输入</span></div>
            <div class="card-body">
              <pre class="output" id="translateOutput" aria-live="polite">翻译结果会显示在这里。</pre>
            </div>
          </div>
        </div>
      </section>
      <section class="view" data-view="keys" id="view-keys" hidden>
        <div class="card">
          <div class="card-head"><h2>Key 池运维</h2><span class="hint" id="keysSummary"></span></div>
          <div class="card-body">
            <div class="form-row" style="margin:0 0 12px">
              <input id="newKey" class="input" style="flex:3;min-width:220px" placeholder="粘贴新的 GOOGLE API Key">
              <button class="btn btn-primary" data-action="addkey"><span data-icon="plus"></span>新增</button>
            </div>
            <details style="margin-bottom:12px">
              <summary class="btn">批量导入</summary>
              <div style="margin-top:10px;display:flex;flex-direction:column;gap:8px">
                <textarea id="bulkKeys" class="textarea" placeholder="每行一个 Key，也支持逗号/分号分隔"></textarea>
                <div>
                  <button class="btn btn-primary" data-action="bulkkeys">导入</button>
                </div>
              </div>
            </details>
            <div id="keysBody" class="table-wrap"></div>
          </div>
        </div>
      </section>
      <section class="view" data-view="usage" id="view-usage" hidden>
        <div class="card">
          <div class="card-head"><h2>用量统计</h2><span class="hint" id="usageSummary"></span></div>
          <div class="card-body"><div id="usageBody" class="table-wrap"></div></div>
        </div>
      </section>
      <section class="view" data-view="traces" id="view-traces" hidden>
        <div class="card">
          <div class="card-head"><h2>最近请求</h2><span class="hint" id="tracesSummary"></span></div>
          <div class="card-body"><div id="tracesBody" class="table-wrap"></div></div>
        </div>
      </section>
      <section class="view" data-view="settings" id="view-settings" hidden>
        <div class="card">
          <div class="card-head"><h2>设置</h2><span class="hint">本地配置</span></div>
          <div class="card-body">
            <div class="settings-row">
              <div class="field">
                <label for="token2">API_MASTER_KEY</label>
                <input id="token2" class="input" type="password" autocomplete="off" placeholder="填主密钥后保存">
              </div>
              <div class="field">
                <label for="themeSelect">主题</label>
                <select id="themeSelect" class="select">
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                </select>
              </div>
            </div>
            <hr class="divider">
            <p style="color:var(--muted);font-size:13px">密钥仅保存在本地浏览器，通过 Authorization 请求头发送，不会写入日志。</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <nav class="mobile-nav" aria-label="移动导航">
    <button class="nav-mobile-item active" data-view="overview"><span data-icon="overview"></span>总览</button>
    <button class="nav-mobile-item" data-view="translate"><span data-icon="translate"></span>翻译</button>
    <button class="nav-mobile-item" data-view="keys"><span data-icon="keys"></span>Keys</button>
    <button class="nav-mobile-item" data-view="usage"><span data-icon="usage"></span>用量</button>
    <button class="nav-mobile-item" data-view="traces"><span data-icon="traces"></span>请求</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const state = {
      view: "overview",
      token: localStorage.getItem("ui_token") || "",
      theme: localStorage.getItem("ui_theme") || "light",
    };
    const VIEWS = {
      overview: ["总览", "服务健康与关键指标"],
      translate: ["翻译工作台", "调用 /v1/chat/completions"],
      keys: ["Key 池运维", "多 Key 与冷却状态"],
      usage: ["用量统计", "按 Key 聚合与错误"],
      traces: ["最近请求", "链路摘要只读"],
      settings: ["设置", "主题与访问密钥"],
    };
    const ICONS = {
      overview: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-4H3zM13 3v6h8V3z"/>',
      translate: '<path d="M5 8h14M12 3v18M8 5l4 3 4-3"/>',
      keys: '<circle cx="7.5" cy="15.5" r="4.5"/><path d="M11 12l8-8h3v3l-2 2h-2v2l-2 2"/>',
      usage: '<path d="M4 20V10M10 20V4M16 20v-7M22 20V8"/>',
      traces: '<path d="M3 12h4l3-8 4 16 3-8h4"/>',
      settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
      zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
      send: '<path d="m22 2-7 20-4-9-9-4 20-7z"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      trash: '<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>',
    };

    function icon(name, size) {
      const s = size || 18;
      return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
    }
    function hydrateIcons() {
      document.querySelectorAll("[data-icon]").forEach((el) => {
        el.innerHTML = icon(el.dataset.icon);
      });
    }
    function esc(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }
    function toast(msg, kind) {
      const el = $("toast");
      el.textContent = msg;
      el.className = "toast show" + (kind ? " " + kind : "");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.className = "toast"; }, 2800);
    }
    function fmtNum(n) {
      return (n == null ? 0 : n).toLocaleString("zh-CN");
    }
    function fmtDuration(sec) {
      const s = Math.max(0, Number(sec) || 0);
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
      if (h) return h + "h " + m + "m";
      return m + "m " + Math.floor(s % 60) + "s";
    }
    function headers() {
      const h = { "Content-Type": "application/json" };
      if (state.token) h["Authorization"] = "Bearer " + state.token;
      return h;
    }
    async function api(path, opts) {
      const res = await fetch(path, Object.assign({ headers: headers() }, opts || {}));
      let body = null;
      try { body = await res.json(); } catch (e) { /* 非 JSON */ }
      if (!res.ok) {
        throw new Error((body && body.error && body.error.message) || ("HTTP " + res.status));
      }
      return body;
    }

    function showView(name) {
      if (!VIEWS[name]) name = "overview";
      state.view = name;
      document.querySelectorAll(".nav-item, .nav-mobile-item").forEach((b) => {
        b.classList.toggle("active", b.dataset.view === name);
      });
      document.querySelectorAll(".view").forEach((v) => { v.hidden = v.dataset.view !== name; });
      $("viewTitle").textContent = VIEWS[name][0];
      $("viewDesc").textContent = VIEWS[name][1];
      if (name === "overview") loadOverview();
      if (name === "keys") loadKeys();
      if (name === "usage") loadUsage();
      if (name === "traces") loadTraces();
      if (name === "settings") {
        $("token2").value = state.token;
        $("themeSelect").value = state.theme;
      }
    }

    async function loadOverview() {
      const el = $("overviewContainer");
      el.innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/admin/overview");
        let ready = null;
        try { ready = await api("/ready"); } catch (e) { ready = null; }
        renderOverview(d, ready);
      } catch (e) {
        el.innerHTML = '<div class="card"><div class="card-body"><p style="color:var(--danger)">加载失败: ' + esc(e.message) + '</p></div></div>';
      }
    }
    function renderOverview(d, ready) {
      const ok = !!(ready && ready.status === "ready");
      $("healthDot").className = ok ? "health-dot ok" : "health-dot bad";
      const items = [
        ["版本", d.version],
        ["运行时长", fmtDuration(d.uptime_seconds)],
        ["缓存后端", d.cache && d.cache.active ? (d.cache.mode || "memory") : "off"],
        ["缓存条数", d.cache && d.cache.size != null ? d.cache.size : "-"],
        ["Key 池", d.key_pool ? d.key_pool.count + " (" + d.key_pool.available + " 可用)" : "-"],
        ["请求总数", fmtNum(d.metrics.requests_total)],
        ["缓存命中", fmtNum(d.metrics.cache_hit_total)],
        ["限流次数", fmtNum(d.metrics.rate_limited_total)],
        ["上游错误", fmtNum(d.metrics.upstream_errors_total)],
        ["链路记录", fmtNum(d.traces_size)],
      ];
      const grid = items.map((it) => '<div class="stat"><div class="stat-label">' + esc(it[0]) + '</div><div class="stat-value">' + esc(it[1]) + '</div></div>').join("");
      $("overviewContainer").innerHTML =
        '<div class="stat-grid">' + grid + '</div>' +
        '<div class="card"><div class="card-head"><h2>服务状态</h2><span class="pill ' + (ok ? "ok" : "err") + '">' + (ok ? "就绪" : "异常") + '</span></div>' +
        '<div class="card-body"><div class="health-panel"><button class="btn btn-primary" data-action="selfcheck">' + icon("zap", 16) + '自检</button></div></div></div>';
      hydrateIcons();
    }

    async function loadKeys() {
      $("keysBody").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/admin/keys");
        $("keysSummary").textContent = "共 " + d.count + " 个 Key，可用 " + d.available + " 个";
        const rows = (d.keys || []).map((k) =>
          '<tr><td><code>' + esc(k.key_hash) + '</code></td>' +
          '<td><span class="pill ' + (k.state === "ok" ? "ok" : "warn") + '">' + (k.state === "ok" ? "可用" : "冷却") + '</span></td>' +
          '<td>' + (k.cooldown_seconds_left || 0).toFixed(1) + 's</td>' +
          '<td><button class="btn btn-danger" data-action="removekey" data-hash="' + esc(k.key_hash) + '">' + icon("trash", 15) + '移除</button></td></tr>'
        ).join("");
        $("keysBody").innerHTML =
          '<table><thead><tr><th>Key 哈希</th><th>状态</th><th>剩余冷却</th><th></th></tr></thead><tbody>' +
          (rows || '<tr><td colspan="4" class="empty">暂无 Key</td></tr>') + '</tbody></table>';
        hydrateIcons();
      } catch (e) {
        $("keysBody").innerHTML = '<p class="empty">加载失败: ' + esc(e.message) + '</p>';
      }
    }
    async function addKey() {
      const v = $("newKey").value.trim();
      if (!v) return toast("请先粘贴 Key", "err");
      try {
        const r = await api("/v1/admin/keys", { method: "POST", body: JSON.stringify({ key: v }) });
        $("newKey").value = "";
        toast("已新增 Key " + r.key_hash, "ok");
        loadKeys();
      } catch (e) { toast("新增失败: " + e.message, "err"); }
    }
    async function bulkImportKeys() {
      const raw = $("bulkKeys").value || "";
      const keys = raw.split(/[\n,;]+/).map((s) => s.trim()).filter(Boolean);
      if (!keys.length) return toast("请先粘贴至少一个 Key", "err");
      try {
        const r = await api("/v1/admin/keys/bulk", {
          method: "POST",
          body: JSON.stringify({ keys }),
        });
        toast("新增 " + r.added.length + " 个，跳过 " + r.skipped.length + " 个", r.added.length ? "ok" : "");
        $("bulkKeys").value = "";
        loadKeys();
      } catch (e) { toast("批量导入失败: " + e.message, "err"); }
    }
    async function removeKey(hash) {
      if (!confirm("确认移除 Key " + hash + "？")) return;
      try {
        await api("/v1/admin/keys/" + encodeURIComponent(hash), { method: "DELETE" });
        toast("已移除", "ok");
        loadKeys();
      } catch (e) { toast("移除失败: " + e.message, "err"); }
    }

    async function loadUsage() {
      $("usageBody").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/admin/usage");
        $("usageSummary").textContent = "Key 切换总数: " + fmtNum(d.switches_total);
        const rows = (d.per_key || []).map((k) =>
          '<tr><td><code>' + esc(k.key_hash) + '</code></td>' +
          '<td>' + fmtNum(k.requests.ok || 0) + '</td><td>' + fmtNum(k.requests.error || 0) + '</td>' +
          '<td>' + esc(JSON.stringify(k.errors || {})) + '</td></tr>'
        ).join("");
        $("usageBody").innerHTML =
          '<table><thead><tr><th>Key 哈希</th><th>成功</th><th>失败</th><th>上游错误码</th></tr></thead><tbody>' +
          (rows || '<tr><td colspan="4" class="empty">暂无数据</td></tr>') + '</tbody></table>';
      } catch (e) {
        $("usageBody").innerHTML = '<p class="empty">加载失败: ' + esc(e.message) + '</p>';
      }
    }

    async function loadTraces() {
      $("tracesBody").innerHTML = '<div class="empty">加载中…</div>';
      try {
        const d = await api("/v1/admin/traces?limit=50");
        $("tracesSummary").textContent = "共 " + fmtNum(d.count) + " 条链路记录";
        const rows = (d.traces || []).map((t) =>
          '<tr><td><code>' + esc(t.request_id) + '</code></td>' +
          '<td><span class="pill ' + (t.cache_hit ? "ok" : "muted") + '">' + (t.cache_hit ? "命中" : "未命中") + '</span></td>' +
          '<td>' + esc(t.upstream_status || "-") + '</td>' +
          '<td>' + (t.duration_ms != null ? t.duration_ms + "ms" : "-") + '</td>' +
          '<td><span class="pill ' + (t.result === "success" ? "ok" : t.result === "error" ? "err" : "muted") + '">' + esc(t.result || "-") + '</span></td></tr>'
        ).join("");
        $("tracesBody").innerHTML =
          '<table><thead><tr><th>request_id</th><th>缓存</th><th>上游</th><th>耗时</th><th>结果</th></tr></thead><tbody>' +
          (rows || '<tr><td colspan="5" class="empty">暂无记录</td></tr>') + '</tbody></table>';
      } catch (e) {
        $("tracesBody").innerHTML = '<p class="empty">加载失败: ' + esc(e.message) + '</p>';
      }
    }

    async function doTranslate() {
      const text = $("transText").value.trim();
      if (!text) return toast("请输入待翻译文本", "err");
      const source = $("transSource").value;
      const target = $("transTarget").value;
      const stream = $("transStream").checked;
      const out = $("translateOutput");
      const meta = $("translateMeta");
      out.textContent = "翻译中…";
      meta.textContent = "请求中…";
      const started = performance.now();
      const body = {
        messages: [{ role: "user", content: text }],
        source_lang: source,
        target_lang: target,
        stream: stream,
      };
      try {
        if (stream) {
          const res = await fetch("/v1/chat/completions", { method: "POST", headers: headers(), body: JSON.stringify(body) });
          if (!res.ok) {
            let msg = "HTTP " + res.status;
            try { const j = await res.json(); msg = (j.error && j.error.message) || msg; } catch (e) {}
            throw new Error(msg);
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let rendered = "";
          while (true) {
            const r = await reader.read();
            if (r.done) break;
            buffer += decoder.decode(r.value, { stream: true });
            let idx;
            while ((idx = buffer.indexOf("\n\n")) >= 0) {
              const block = buffer.slice(0, idx);
              buffer = buffer.slice(idx + 2);
              block.split("\n").forEach((line) => {
                if (!line.startsWith("data: ")) return;
                const payload = line.slice(6).trim();
                if (payload === "[DONE]") return;
                try {
                  const obj = JSON.parse(payload);
                  const delta = obj.choices && obj.choices[0] && obj.choices[0].delta && obj.choices[0].delta.content;
                  if (delta) { rendered += delta; out.textContent = rendered; }
                } catch (e) {}
              });
            }
          }
          if (!rendered) throw new Error("流式响应为空");
          meta.textContent = "完成 · " + ((performance.now() - started) / 1000).toFixed(1) + "s";
        } else {
          const d = await api("/v1/chat/completions", { method: "POST", body: JSON.stringify(body) });
          const content = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
          out.textContent = content || "";
          meta.textContent = "完成 · " + ((performance.now() - started) / 1000).toFixed(1) + "s";
        }
      } catch (e) {
        out.textContent = "翻译失败: " + e.message;
        meta.textContent = "失败";
      }
    }

    async function selfCheck() {
      const btn = document.querySelector('[data-action="selfcheck"]');
      const old = btn ? btn.innerHTML : "";
      if (btn) { btn.disabled = true; btn.innerHTML = icon("zap", 16) + "检查中…"; }
      try {
        const h = await api("/health");
        const t = await api("/v1/chat/completions", {
          method: "POST",
          body: JSON.stringify({ messages: [{ role: "user", content: "self check" }], target_lang: "zh-CN", stream: false }),
        });
        const content = t.choices && t.choices[0] && t.choices[0].message && t.choices[0].message.content;
        toast("自检通过: " + h.status + " · " + (content || ""), "ok");
      } catch (e) {
        toast("自检失败: " + e.message, "err");
      } finally {
        if (btn) { btn.disabled = false; btn.innerHTML = old || (icon("zap", 16) + "自检"); hydrateIcons(); }
      }
    }

    function applyTheme(theme) {
      state.theme = theme;
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("ui_theme", theme);
      const btn = document.querySelector('[data-action="theme"]');
      if (btn) btn.textContent = theme === "dark" ? "浅色主题" : "深色主题";
    }
    function saveToken() {
      const v = $("token").value.trim() || $("token2").value.trim();
      state.token = v;
      localStorage.setItem("ui_token", v);
      $("token").value = v;
      if ($("token2")) $("token2").value = v;
      toast(v ? "Token 已保存" : "已清除 Token", "ok");
    }

    document.addEventListener("click", (e) => {
      const nav = e.target.closest(".nav-item, .nav-mobile-item");
      if (nav) { showView(nav.dataset.view); return; }
      const act = e.target.closest("[data-action]");
      if (!act) return;
      if (act.dataset.action === "savetoken") saveToken();
      if (act.dataset.action === "theme") applyTheme(state.theme === "dark" ? "light" : "dark");
      if (act.dataset.action === "addkey") addKey();
      if (act.dataset.action === "bulkkeys") bulkImportKeys();
      if (act.dataset.action === "removekey") removeKey(act.dataset.hash);
      if (act.dataset.action === "translate") doTranslate();
      if (act.dataset.action === "selfcheck") selfCheck();
    });
    $("themeSelect").addEventListener("change", (e) => applyTheme(e.target.value));
    $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") saveToken(); });
    $("token2").addEventListener("keydown", (e) => { if (e.key === "Enter") saveToken(); });
    $("transText").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); doTranslate(); }
    });

    $("token").value = state.token;
    applyTheme(state.theme);
    hydrateIcons();
    showView("overview");
  </script>
</body>
</html>
