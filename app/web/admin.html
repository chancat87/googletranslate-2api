<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>googletranslate-2api 管理面板</title>
  <style>
    :root {
      --bg: #f4f6f8; --card: #ffffff; --line: #dfe4ea; --text: #1d2733;
      --muted: #637083; --accent: #1668dc; --ok: #0d8a4e; --err: #c22f2f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg); color: var(--text); }
    header { background: #10243c; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 17px; margin: 0; letter-spacing: 0; }
    header .sub { color: #9db4cc; font-size: 12px; }
    .wrap { max-width: 980px; margin: 20px auto; padding: 0 16px; }
    .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .bar input { flex: 1; min-width: 220px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; }
    button { padding: 8px 14px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; font-size: 13px; }
    button.secondary { background: #eef2f6; color: var(--text); border: 1px solid var(--line); }
    button:disabled { opacity: .55; cursor: wait; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
    .tabs button { background: #eef2f6; color: var(--text); border: 1px solid var(--line); }
    .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-height: 220px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
    .stat { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #fafbfc; }
    .stat b { display: block; font-size: 22px; margin-top: 4px; letter-spacing: 0; }
    .stat span { color: var(--muted); font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); word-break: break-all; }
    th { color: var(--muted); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
    .pill.ok { background: #e2f4ea; color: var(--ok); }
    .pill.cooldown { background: #fdeee0; color: #9a5b10; }
    .msg { margin-top: 12px; font-size: 13px; min-height: 18px; }
    .msg.err { color: var(--err); }
    .msg.ok { color: var(--ok); }
    pre { background: #0f1b29; color: #d8e6f5; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; max-height: 320px; }
  </style>
</head>
<body>
  <header>
    <h1>googletranslate-2api</h1>
    <span class="sub">管理面板 · 只读总览 + Key 池运维</span>
  </header>
  <div class="wrap">
    <div class="bar">
      <label style="white-space:nowrap;font-size:13px">API_MASTER_KEY</label>
      <input id="token" type="password" placeholder="填主密钥后自动保存到本地">
      <button class="secondary" onclick="saveToken()">保存</button>
      <button onclick="selfCheck()" id="selfBtn">自检</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="overview" onclick="showTab('overview')">总览</button>
      <button data-tab="keys" onclick="showTab('keys')">Keys</button>
      <button data-tab="usage" onclick="showTab('usage')">用量</button>
      <button data-tab="traces" onclick="showTab('traces')">最近请求</button>
    </div>
    <div class="panel">
      <section id="tab-overview"></section>
      <section id="tab-keys" hidden></section>
      <section id="tab-usage" hidden></section>
      <section id="tab-traces" hidden></section>
    </div>
    <div id="msg" class="msg"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let currentTab = "overview";

    function token() { return $("token").value.trim(); }
    function headers() {
      const h = { "Content-Type": "application/json" };
      if (token()) h["Authorization"] = "Bearer " + token();
      return h;
    }
    function saveToken() {
      localStorage.setItem("admin_token", $("token").value.trim());
      say("Token 已保存", "ok");
    }
    function say(text, kind) { const m = $("msg"); m.textContent = text; m.className = "msg " + (kind || ""); }

    function showTab(name) {
      currentTab = name;
      document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
      ["overview", "keys", "usage", "traces"].forEach(t => $("tab-" + t).hidden = t !== name);
      load(name);
    }

    async function api(path, opts) {
      const r = await fetch(path, Object.assign({ headers: headers() }, opts || {}));
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error && body.error.message ? body.error.message : ("HTTP " + r.status));
      return body;
    }

    async function load(name) {
      const sec = $("tab-" + name);
      sec.innerHTML = '<p style="color:var(--muted)">加载中…</p>';
      try {
        if (name === "overview") return renderOverview(await api("/v1/admin/overview"));
        if (name === "keys") return renderKeys(await api("/v1/admin/keys"));
        if (name === "usage") return renderUsage(await api("/v1/admin/usage"));
        if (name === "traces") return renderTraces(await api("/v1/admin/traces?limit=30"));
      } catch (e) {
        sec.innerHTML = '<p style="color:var(--err)">加载失败: ' + e.message + '</p>';
      }
    }

    function stat(title, value) {
      return '<div class="stat"><span>' + title + '</span><b>' + value + '</b></div>';
    }

    function renderOverview(d) {
      $("tab-overview").innerHTML =
        '<div class="grid">' +
        stat("版本", d.version) + stat("运行时长", d.uptime_seconds + "s") +
        stat("缓存后端", d.cache.active) + stat("缓存条数", d.cache.size == null ? "-" : d.cache.size) +
        stat("Key 池", d.key_pool.count + " (" + d.key_pool.available + " 可用)") +
        stat("请求总数", d.metrics.requests_total) +
        stat("缓存命中", d.metrics.cache_hit_total) +
        stat("限流计数", d.metrics.rate_limited_total) +
        stat("上游错误", d.metrics.upstream_errors_total) +
        stat("链路记录", d.traces_size) +
        '</div>';
    }

    function renderKeys(d) {
      const rows = d.keys.map(k =>
        '<tr><td><code>' + k.key_hash + '</code></td>' +
        '<td><span class="pill ' + k.state + '">' + (k.state === "ok" ? "可用" : "冷却") + '</span></td>' +
        '<td>' + k.cooldown_seconds_left.toFixed(1) + 's</td>' +
        '<td><button class="secondary" onclick="removeKey(\'' + k.key_hash + '\')">移除</button></td></tr>'
      ).join("");
      $("tab-keys").innerHTML =
        '<p>共 <b>' + d.count + '</b> 个 Key，可用 <b>' + d.available + '</b> 个</p>' +
        '<div style="display:flex;gap:8px;margin-bottom:10px">' +
        '<input id="newKey" placeholder="粘贴新 GOOGLE API Key" style="flex:1;padding:8px;border:1px solid var(--line);border-radius:6px">' +
        '<button onclick="addKey()">新增</button></div>' +
        '<table><thead><tr><th>Key 哈希</th><th>状态</th><th>剩余冷却</th><th></th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="4">暂无 Key</td></tr>') + '</tbody></table>';
    }

    async function addKey() {
      const v = $("newKey").value.trim();
      if (!v) return say("请先粘贴 Key", "err");
      try {
        const r = await api("/v1/admin/keys", { method: "POST", body: JSON.stringify({ key: v }) });
        $("newKey").value = "";
        say("已新增 Key " + r.key_hash, "ok");
        load("keys");
      } catch (e) { say("新增失败: " + e.message, "err"); }
    }

    async function removeKey(hash) {
      if (!confirm("确认移除 Key " + hash + "？")) return;
      try {
        await api("/v1/admin/keys/" + hash, { method: "DELETE" });
        say("已移除", "ok");
        load("keys");
      } catch (e) { say("移除失败: " + e.message, "err"); }
    }

    function renderUsage(d) {
      const rows = d.per_key.map(k =>
        '<tr><td><code>' + k.key_hash + '</code></td><td>' + (k.requests.ok || 0) + '</td>' +
        '<td>' + (k.requests.error || 0) + '</td><td>' + JSON.stringify(k.errors) + '</td></tr>'
      ).join("");
      $("tab-usage").innerHTML =
        '<p>Key 切换总数: <b>' + d.switches_total + '</b></p>' +
        '<table><thead><tr><th>Key 哈希</th><th>成功</th><th>失败</th><th>上游错误码</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="4">暂无数据</td></tr>') + '</tbody></table>';
    }

    function renderTraces(d) {
      const rows = d.traces.map(t =>
        '<tr><td><code>' + t.request_id + '</code></td><td>' + (t.cache_hit ? "命中" : "未命中") + '</td>' +
        '<td>' + (t.upstream_status || "-") + '</td><td>' + (t.duration_ms != null ? t.duration_ms + "ms" : "-") + '</td>' +
        '<td>' + (t.result || "-") + '</td></tr>'
      ).join("");
      $("tab-traces").innerHTML =
        '<p>共 <b>' + d.count + '</b> 条链路记录</p>' +
        '<table><thead><tr><th>request_id</th><th>缓存</th><th>上游</th><th>耗时</th><th>结果</th></tr></thead><tbody>' +
        (rows || '<tr><td colspan="5">暂无记录</td></tr>') + '</tbody></table>';
    }

    async function selfCheck() {
      const btn = $("selfBtn");
      btn.disabled = true; btn.textContent = "检查中…";
      try {
        const h = await api("/health");
        const t = await api("/v1/chat/completions", {
          method: "POST",
          body: JSON.stringify({ messages: [{ role: "user", content: "self check" }], target_lang: "zh-CN", stream: false })
        });
        const content = (t.choices && t.choices[0] && t.choices[0].message && t.choices[0].message.content) || "";
        say("自检通过: health=" + h.status + "，翻译结果=" + content, "ok");
      } catch (e) {
        say("自检失败: " + e.message, "err");
      } finally {
        btn.disabled = false; btn.textContent = "自检";
      }
    }

    $("token").value = localStorage.getItem("admin_token") || "";
    $("token").addEventListener("keydown", (e) => { if (e.key === "Enter") saveToken(); });
    load(currentTab);
  </script>
</body>
</html>
