worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream googletranslate_backend {
        # API 是无状态的，无需 ip_hash
        server app:8000;
    }

    # --- 限流兜底 (3.B.4, 默认不限制任何请求) ---
    # 多副本/高流量部署时, 应用层限流(RATE_LIMIT_ENABLED)为进程内实现不共享,
    # 可在网关层按需启用: 下面第 1 行仅定义 zone(无副作用), 第 2 行取消注释即生效。
    limit_req_zone $binary_remote_addr zone=translate_global:10m rate=10r/s;

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://googletranslate_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流式传输优化
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;

            # 超时与请求体大小限制
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 2m;

            # 网关层限流(默认关闭, 需要时取消注释并调参)
            # limit_req_status 429;   # 与应用层 429 语义一致 (默认 503)
            # limit_req zone=translate_global burst=20 nodelay;
        }
    }
}