name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov ruff mypy prometheus_client

      - name: Ruff lint
        run: python -m ruff check app main.py tests scripts

      - name: Ruff format check
        run: python -m ruff format --check app main.py tests scripts

      - name: Mypy type check
        run: python -m mypy app main.py

      - name: Docs links check
        run: python scripts/check_docs_links.py

      - name: Test with coverage
        run: python -m pytest --cov=app --cov=main --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

      - name: Docker build smoke
        run: docker build -t googletranslate-2api .

      - name: Kubeconform schema validate
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -ignore-missing-schemas -summary deploy/k8s

      - name: Web UI browser E2E
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run web:ui:e2e

  security-scan:
    runs-on: ubuntu-latest
    # 历史 commit 含已知泄漏 key (见 docs/AUDIT_2026-09-22.md), gitleaks 失败不阻塞发版, 但会留证
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ""
          GITLEAKS_NOTICE: ""

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Dependency vuln scan (pip-audit)
        run: |
          pip install pip-audit
          python -m pip_audit -r requirements.txt --progress-spinner off | tee pip-audit.txt || true
          python -m pip_audit -r requirements-dev.txt --progress-spinner off || true

  bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest-cov ruff mypy prometheus_client
      - name: Run deterministic bench (mock upstream)
        run: python scripts/bench_ci.py --output bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

  notify:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: failure()
    steps:
      - name: Send Slack failure notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK 未配置, 跳过通知"
            exit 0
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"❌ CI 失败\\n仓库: ${{ github.repository }}\\n分支: $REF\\n提交: ${SHA:0:8}\\n查看: $RUN_URL\"}" \
            "$SLACK_WEBHOOK"
