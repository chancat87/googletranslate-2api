services:
  nginx:
    image: nginx:latest
    container_name: googletranslate-2api-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-8088}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - googletranslate-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: googletranslate-2api-app
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    mem_limit: 400m
    cpus: "1.0"
    networks:
      - googletranslate-net

networks:
  googletranslate-net:
    driver: bridge