[project]
name = "googletranslate-2api"
version = "2.12.2"
description = "Google Translate -> OpenAI 兼容 API 代理"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
files = ["app", "main.py"]

[tool.coverage.run]
source = ["app", "main"]
omit = ["app/*/__init__.py", "app/__init__.py"]

[tool.coverage.report]
fail_under = 97
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
]
